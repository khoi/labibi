appId: com.labradoodle.app
name: Keyboard lifecycle regression
tags:
  - screenshots
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny

# A cold API 34 emulator can show a launcher ANR over the healthy app.
- extendedWaitUntil:
    visible: "Sign up for Labradoodle|Pixel Launcher isn't responding"
    timeout: 60000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
- extendedWaitUntil:
    visible: "Sign up for Labradoodle"
    timeout: 30000
- takeScreenshot: "02-sign-up"
- tapOn: "Sign in"
- runFlow:
    when:
      notVisible:
        id: "server-address"
    commands:
      - assertVisible: "Sign in to Labradoodle"
      - takeScreenshot: "01-sign-in"
      - tapOn: "Use a custom server"
- assertVisible: "Server"
- takeScreenshot: "03-server"
- runFlow: helpers/server.yaml

- tapOn: "Email"
- inputText: ${LABRADOODLE_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${LABRADOODLE_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Don’t allow"
    optional: true

- extendedWaitUntil:
    visible: "Launch team"
    timeout: 30000
- openLink: "labradoodle:///thread?threadId=${LABRADOODLE_SCREENSHOT_THREAD_ID}"
- extendedWaitUntil:
    visible: "Message Doodle"
    timeout: 15000
- tapOn: "Message Doodle"
- inputText: "Keyboard lifecycle check"
- pressKey: Enter
- inputText: "Second line"
- assertVisible: 'Keyboard lifecycle check\nSecond line'
- assertVisible: "Send"
- takeScreenshot: "keyboard-initial"
- pressKey: Home
- launchApp:
    stopApp: false
- tapOn: "Message Doodle"
- assertVisible: 'Keyboard lifecycle check\nSecond line'
- assertVisible: "Send"
- takeScreenshot: "keyboard-resumed"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Launch team"
    timeout: 30000
- tapOn: "Summarize the fixture launch checklist."
- extendedWaitUntil:
    visible: "Message Doodle"
    timeout: 15000
# The unsent draft survives a restart.
- tapOn: "Message Doodle"
- assertVisible: 'Keyboard lifecycle check\nSecond line'
- assertVisible: "Send"
- takeScreenshot: "keyboard-restarted"
- hideKeyboard
- openLink: "labradoodle:///account"
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign in to Labradoodle"
    timeout: 15000
- tapOn: "Email"
- inputText: ${LABRADOODLE_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${LABRADOODLE_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Launch team"
    timeout: 15000
- openLink: "labradoodle:///thread?threadId=${LABRADOODLE_SCREENSHOT_THREAD_ID}"
- extendedWaitUntil:
    visible: "Message Doodle"
    timeout: 15000
- tapOn: "Message Doodle"
- eraseText: 100
- inputText: "Keyboard lifecycle check"
- pressKey: Enter
- inputText: "Second line"
- assertVisible: 'Keyboard lifecycle check\nSecond line'
- assertVisible: "Send"
- takeScreenshot: "keyboard-signed-in-again"
- hideKeyboard
