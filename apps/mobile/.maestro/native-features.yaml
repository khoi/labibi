appId: com.labradoodle.app
name: Android native features
tags:
  - android
---
# Exercises native modules and system UI in a release build: device speech, sharing in,
# the photo and document pickers, camera permission, and the PDF viewer.
- launchApp:
    clearState: true
    permissions:
      notifications: allow
      microphone: allow
- runFlow: helpers/sign-in.yaml

# Device speech (expo-speech): no voice provider is connected yet.
- openLink: "labradoodle:///thread?botId=${LABRADOODLE_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "The fixture workspace is ready."
    timeout: 10000
- longPressOn: "The fixture workspace is ready."
- tapOn: "Speak message"
- extendedWaitUntil:
    visible: "Stop"
    timeout: 10000
- assertNotVisible: "Could not speak"
- takeScreenshot: "40-speak-message"
- tapOn: "Stop"

# Text shared in from another app opens the share sheet, then the chosen chat.
- evalScript: ${output.share = http.get(LABRADOODLE_DEVICE_CONTROL_URL + '/share-text')}
- assertTrue: ${output.share.ok}
- extendedWaitUntil:
    visible: "Share to"
    timeout: 15000
- takeScreenshot: "41-share-to"
- tapOn: "Researcher"
- extendedWaitUntil:
    visible: "Shared from another app"
    timeout: 10000

# Photo picker (expo-image-picker).
- tapOn: "Attach file"
- tapOn: "Photo library"
- extendedWaitUntil:
    visible: "Photo taken on.*|.*labradoodle-fixture.*"
    timeout: 15000
- takeScreenshot: "42-photo-picker"
- tapOn:
    text: "Photo taken on.*|.*labradoodle-fixture.*"
    index: 0
- runFlow:
    when:
      visible: "Add.*"
    commands:
      - tapOn: "Add.*"
- extendedWaitUntil:
    visible: "Remove .*"
    timeout: 15000

# Document picker (expo-document-picker): the PDF the harness put in Downloads.
- tapOn: "Attach file"
- tapOn: "File"
- runFlow:
    when:
      notVisible: "labradoodle-fixture.pdf"
    commands:
      - tapOn: "Show roots"
      - tapOn: "Downloads"
- extendedWaitUntil:
    visible: "labradoodle-fixture.pdf"
    timeout: 15000
- takeScreenshot: "43-document-picker"
- tapOn: "labradoodle-fixture.pdf"
- extendedWaitUntil:
    visible: "Remove labradoodle-fixture.pdf"
    timeout: 15000

# Camera permission (the emulator has no camera, so the flow denies the prompt).
- tapOn: "Attach file"
- tapOn: "Camera"
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- extendedWaitUntil:
    visible: "Skipped Camera.*"
    timeout: 10000
- takeScreenshot: "44-composer-attachments"

- tapOn: "Send"
- extendedWaitUntil:
    visible: ".*labradoodle-fixture.pdf"
    timeout: 30000
- extendedWaitUntil:
    visible: "Open image .*"
    timeout: 15000
- takeScreenshot: "45-sent-attachments"

# Native PDF viewer (labradoodle-pdf-view): Share appears only after the file loaded.
- tapOn: ".*labradoodle-fixture.pdf"
- extendedWaitUntil:
    visible: "Share"
    timeout: 20000
- assertNotVisible: "Could not open this PDF."
- assertNotVisible: "Could not load this artifact."
- takeScreenshot: "46-pdf-viewer"
- back
- extendedWaitUntil:
    visible: "Message Researcher|Shared from another app"
    timeout: 10000

# Vault's New item menu opens from a Compose-hosted trigger on Android.
- openLink: "labradoodle:///vault"
- extendedWaitUntil:
    visible: "New item"
    timeout: 15000
- tapOn: "New item"
- extendedWaitUntil:
    visible: "API key"
    timeout: 5000
- takeScreenshot: "46b-vault-new-item"
- back

# A long press on a row opens its menu instead of the row's own tap action.
- openLink: "labradoodle:///archived-bots"
- extendedWaitUntil:
    visible: "Archived fixture"
    timeout: 15000
- longPressOn: "Archived fixture"
- extendedWaitUntil:
    visible: "Restore"
    timeout: 5000
- takeScreenshot: "46c-archived-bot-menu"
- back
- openLink: "labradoodle:///thread?botId=${LABRADOODLE_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "Message Researcher"
    timeout: 10000
