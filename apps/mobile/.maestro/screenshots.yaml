appId: com.labradoodle.app
name: Labradoodle mobile screenshots
tags:
  - screenshots
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny

# A cold API 34 emulator can show a launcher ANR over the healthy app.
- extendedWaitUntil:
    visible: "Sign up for Labradoodle|Pixel Launcher isn't responding"
    timeout: 60000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
- extendedWaitUntil:
    visible: "Sign up for Labradoodle"
    timeout: 30000
- takeScreenshot: "02-sign-up"
- tapOn: "Sign in"
- runFlow:
    when:
      notVisible:
        id: "server-address"
    commands:
      - assertVisible: "Sign in to Labradoodle"
      - takeScreenshot: "01-sign-in"
      - tapOn: "Use a custom server"
- assertVisible: "Server"
- takeScreenshot: "03-server"
- runFlow: helpers/server.yaml

- tapOn: "Email"
- inputText: ${LABRADOODLE_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${LABRADOODLE_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Don’t allow"
    optional: true

- extendedWaitUntil:
    visible: "Launch team"
    timeout: 30000
- takeScreenshot: "04-inbox"

- tapOn:
    id: "home-search-button"
    optional: true
- runFlow:
    when:
      notVisible:
        id: "search-sheet-field"
    commands:
      - tapOn: "Search"
- tapOn:
    id: "search-sheet-field"
- inputText: "fixture"
- hideKeyboard
- extendedWaitUntil:
    visible: "Weekly fixture review"
    timeout: 10000
- takeScreenshot: "06-search-results"
- tapOn:
    id: "search-sheet-close"

- openLink: "labradoodle:///new-chat"
- assertVisible: "Start chat"
- takeScreenshot: "08-new-chat"

- openLink: "labradoodle:///account"
- extendedWaitUntil:
    visible: "Change password"
    timeout: 10000
- takeScreenshot: "10-account"
- tapOn: "Change password"
- assertVisible: "Current password"
- takeScreenshot: "10b-change-password"
- back
- scrollUntilVisible:
    element: "Notification settings"
    direction: DOWN
- takeScreenshot: "10c-account-notifications"

- openLink: "labradoodle:///models"
- extendedWaitUntil:
    visible: "Main model"
    timeout: 10000
- assertVisible: "Approval model"
- takeScreenshot: "11-models"

- openLink: "labradoodle:///voice"
- extendedWaitUntil:
    visible: "Scripted"
    timeout: 10000
- takeScreenshot: "12-voice"

- openLink: "labradoodle:///integrations"
- extendedWaitUntil:
    visible: "Search apps"
    timeout: 10000
- takeScreenshot: "13-integrations"
- tapOn: "Add custom"
- tapOn: "MCP server"
- extendedWaitUntil:
    visible: "Remote MCP server"
    timeout: 10000
- takeScreenshot: "14-integrations-advanced"

- openLink: "labradoodle:///thread?threadId=${LABRADOODLE_SCREENSHOT_THREAD_ID}"
- extendedWaitUntil:
    visible: "The fixture workspace is ready."
    timeout: 10000
- assertNotVisible: "Reply"
- assertNotVisible: "React"
- assertNotVisible: "More"
- takeScreenshot: "15-thread"
- tapOn: "Message Doodle"
- inputText: "Keyboard visibility check"
- assertVisible: "Keyboard visibility check"
- assertVisible: "Send"
- takeScreenshot: "15d-thread-keyboard"
- pressKey: Enter
- inputText: "Second line"
- assertVisible: 'Keyboard visibility check\nSecond line'
- hideKeyboard
- assertVisible: 'Keyboard visibility check\nSecond line'
- tapOn: "Message Doodle"
- assertVisible: 'Keyboard visibility check\nSecond line'
- assertVisible: "Send"
- takeScreenshot: "15g-thread-keyboard-reopened"
- longPressOn: "Message Doodle"
- tapOn: "Select all"
- eraseText: 1
- assertNotVisible: 'Keyboard visibility check\nSecond line'
- hideKeyboard
# Holding a message opens the reaction row and grouped actions next to it.
- longPressOn: "The fixture workspace is ready."
- assertVisible: "Reply"
- assertVisible: "👍"
- assertVisible: "Speak message"
- takeScreenshot: "15b-message-actions"
- back
# Settle the keyboard inset before measuring the next message target.
- hideKeyboard
- waitForAnimationToEnd
# User messages omit Speak.
- longPressOn: "Summarize the fixture launch checklist."
- assertVisible: "Reply"
- assertVisible: "👍"
- assertVisible: "Copy"
- assertNotVisible: "Speak message"
- tapOn: "Reply"
- assertVisible: "Cancel reply"
- tapOn: "Cancel reply"
# A chat's people, Doodle and actions live in its settings.
- openLink: "labradoodle:///chat-settings?threadId=${LABRADOODLE_SCREENSHOT_THREAD_ID}"
- extendedWaitUntil:
    visible: "Delete chat"
    timeout: 10000
- assertVisible: "Clear conversation"
- takeScreenshot: "16-chat-settings"

- openLink: "labradoodle:///doodle-settings"
- extendedWaitUntil:
    visible: "Instructions"
    timeout: 10000
- assertVisible: "Model"
- takeScreenshot: "17-doodle-settings"

- openLink: "labradoodle:///computer"
- extendedWaitUntil:
    visible: "Take control"
    timeout: 10000
- takeScreenshot: "18-computer"

- openLink: "labradoodle:///thread?threadId=${LABRADOODLE_SCREENSHOT_TEAM_THREAD_ID}"
- extendedWaitUntil:
    visible: "The fixture launch plan is ready."
    timeout: 10000
- assertNotVisible: "Reply"
- assertNotVisible: "React"
- assertNotVisible: "More"
- takeScreenshot: "19-team-chat"
- tapOn: "Message Doodle"
- inputText: "Team keyboard visibility check"
- assertVisible: "Team keyboard visibility check"
- assertVisible: "Send"
- takeScreenshot: "19b-team-chat-keyboard"
- eraseText
- hideKeyboard
- longPressOn: "The fixture launch plan is ready."
- assertVisible: "Reply"
- assertVisible: "👍"
- assertVisible: "Speak message"
- back

- openLink: "labradoodle:///chat-settings?threadId=${LABRADOODLE_SCREENSHOT_TEAM_THREAD_ID}"
- extendedWaitUntil:
    visible: "Delete chat"
    timeout: 10000
- takeScreenshot: "20-team-chat-settings"

- openLink: "labradoodle:///routine?threadId=${LABRADOODLE_SCREENSHOT_THREAD_ID}&routineId=${LABRADOODLE_SCREENSHOT_ROUTINE_ID}"
- extendedWaitUntil:
    visible: "Weekly fixture review"
    timeout: 10000
- takeScreenshot: "21-routine"

# Verify saved appearance changes on already-mounted screens and modal routes.
- openLink: "labradoodle:///account"
- extendedWaitUntil:
    visible: "Dark"
    timeout: 10000
- tapOn: "Dark"
- takeScreenshot: "22-account-dark"
- scrollUntilVisible:
    element: "Notification settings"
    direction: DOWN
- takeScreenshot: "22b-account-notifications-dark"

- openLink: "labradoodle:///new-chat"
- assertVisible: "Start chat"
- takeScreenshot: "24-new-chat-dark"

- openLink: "labradoodle:///thread?threadId=${LABRADOODLE_SCREENSHOT_THREAD_ID}"
- extendedWaitUntil:
    visible: "The fixture workspace is ready."
    timeout: 10000
- takeScreenshot: "26-thread-dark"

- openLink: "labradoodle:///thread?threadId=${LABRADOODLE_SCREENSHOT_TEAM_THREAD_ID}"
- extendedWaitUntil:
    visible: "The fixture launch plan is ready."
    timeout: 10000
- takeScreenshot: "27-team-chat-dark"

- openLink: "labradoodle:///chat-settings?threadId=${LABRADOODLE_SCREENSHOT_TEAM_THREAD_ID}"
- assertVisible: "Delete chat"
- takeScreenshot: "28-team-chat-settings-dark"

- openLink: "labradoodle:///account"
- tapOn: "Light"
- openLink: "labradoodle:///thread?threadId=${LABRADOODLE_SCREENSHOT_THREAD_ID}"
- assertVisible: "The fixture workspace is ready."
- takeScreenshot: "29-thread-light-restored"

# Capture the reaction after theme comparisons. Reactions are append-only, so adding
# 👍 earlier would leak into dark/light thread frames with no remove control.
- longPressOn: "The fixture workspace is ready."
- tapOn: "👍"
- extendedWaitUntil:
    visible: "👍"
    timeout: 10000
- assertNotVisible: "Reply"
- takeScreenshot: "15c-message-reaction"
