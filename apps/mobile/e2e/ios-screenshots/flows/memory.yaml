appId: com.labradoodle.app
name: Memory
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      LABRADOODLE_ACTIVE_EMAIL: ${LABRADOODLE_SCREENSHOT_EMAIL}
- openLink: "labradoodle:///memory"
- extendedWaitUntil:
    visible: "team.md"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-personal-memory
- tapOn: "team.md"
- extendedWaitUntil:
    visible: ".*Dana owns the announcement.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-personal-note
- openLink: "labradoodle:///memory?threadId=${LABRADOODLE_SCREENSHOT_THREAD_ID}"
- extendedWaitUntil:
    visible: "preferences.md"
    timeout: 15000
- tapOn: "preferences.md"
- extendedWaitUntil:
    visible: ".*Cite a source for every claim.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-chat-note
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Delete preferences.md?"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-delete-confirm
- tapOn: "Cancel"
