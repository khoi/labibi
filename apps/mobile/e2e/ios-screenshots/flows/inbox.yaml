appId: com.labradoodle.app
name: Inbox
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      LABRADOODLE_ACTIVE_EMAIL: ${LABRADOODLE_SCREENSHOT_EMAIL}
- extendedWaitUntil:
    visible: ".*Launch team.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-inbox
- openLink: "labradoodle:///artifacts"
- extendedWaitUntil:
    visible: ".*launch-notes.txt.*|.*No artifacts yet.*|.*Files.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-artifacts
