appId: com.labradoodle.app
name: Messaging
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      LABRADOODLE_ACTIVE_EMAIL: ${LABRADOODLE_SCREENSHOT_EMAIL}
- openLink: "labradoodle:///messaging"
- extendedWaitUntil:
    visible: ".*#launch.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-messaging
- tapOn: ".*#launch.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-team-conversation
