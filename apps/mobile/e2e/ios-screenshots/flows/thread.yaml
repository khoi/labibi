appId: com.rakazo.app
name: Thread
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- openLink: "rakazo:///thread?threadId=${RAKAZO_SCREENSHOT_THREAD_ID}"
- extendedWaitUntil:
    visible: ".*The fixture workspace is ready.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-thread
- scrollUntilVisible:
    element: ".*launch-notes.txt.*"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 40
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-attachment
- openLink: "rakazo:///thread?threadId=${RAKAZO_SCREENSHOT_TEAM_THREAD_ID}"
- extendedWaitUntil:
    visible: ".*The fixture launch plan is ready.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-team-chat
- openLink: "rakazo:///thread?threadId=${RAKAZO_SCREENSHOT_THREAD_ID}"
- extendedWaitUntil:
    visible: ".*The fixture workspace is ready.*"
    timeout: 20000
- longPressOn:
    text: ".*The fixture workspace is ready.*"
- extendedWaitUntil:
    visible: ".*Reply.*"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: ".*Reply.*"
    commands:
      - assertVisible: ".*Copy.*"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: 04-message-actions
      - tapOn: "Copy"
- openLink: "rakazo:///thread?threadId=${RAKAZO_SCREENSHOT_THREAD_ID}"
- scrollUntilVisible:
    element: ".*launch-notes.txt.*"
    direction: DOWN
    timeout: 15000
- tapOn: ".*launch-notes.txt.*"
- extendedWaitUntil:
    visible: ".*Collect three customer quotes.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-attachment-preview
# The catalog's offline billing has invites on, so the Pro account always sees the gift.
- openLink: "rakazo:///thread?threadId=${RAKAZO_SCREENSHOT_THREAD_ID}"
- tapOn: "Invite a friend"
- extendedWaitUntil:
    visible: ".*2 weeks free.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-invite
