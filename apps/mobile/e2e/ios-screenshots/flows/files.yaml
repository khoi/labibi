appId: com.labradoodle.app
name: Files
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      LABRADOODLE_ACTIVE_EMAIL: ${LABRADOODLE_SCREENSHOT_EMAIL}
- openLink: "labradoodle:///artifact?artifactId=${LABRADOODLE_SCREENSHOT_ARTIFACT_ID}"
- extendedWaitUntil:
    visible: ".*Collect three customer quotes.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-text
- openLink: "labradoodle:///artifact?artifactId=${LABRADOODLE_SCREENSHOT_MARKDOWN_ID}"
- extendedWaitUntil:
    visible: ".*Collect customer quotes.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-markdown
- openLink: "labradoodle:///artifact?artifactId=${LABRADOODLE_SCREENSHOT_PDF_ID}"
- extendedWaitUntil:
    visible: ".*launch-brief.pdf.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-pdf
- openLink: "labradoodle:///artifact?artifactId=${LABRADOODLE_SCREENSHOT_ARCHIVE_ID}"
- extendedWaitUntil:
    visible: ".*No preview.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-no-preview
- openLink: "labradoodle:///image?artifactId=${LABRADOODLE_SCREENSHOT_IMAGE_ID}&name=launch-chart.png&mimeType=image%2Fpng&threadId=${LABRADOODLE_SCREENSHOT_THREAD_ID}"
- extendedWaitUntil:
    visible: ".*launch-chart.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-image
- openLink: "labradoodle:///artifact?artifactId=${LABRADOODLE_SCREENSHOT_VIDEO_ID}"
- extendedWaitUntil:
    visible: ".*launch-demo.mp4.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-video
