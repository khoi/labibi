appId: com.labradoodle.app
name: New account
---
# A hosted sign-up: the survey before the inbox.
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      LABRADOODLE_ACTIVE_EMAIL: ${LABRADOODLE_SCREENSHOT_FREE_EMAIL}
- extendedWaitUntil:
    visible: ".*How did you hear about us.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-signup-survey
