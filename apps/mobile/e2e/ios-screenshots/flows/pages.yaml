appId: com.labradoodle.app
name: Pages
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      LABRADOODLE_ACTIVE_EMAIL: ${LABRADOODLE_SCREENSHOT_EMAIL}
- openLink: "labradoodle:///thread?threadId=${LABRADOODLE_SCREENSHOT_THREAD_ID}"
- extendedWaitUntil:
    visible: "Open Launch dashboard"
    timeout: 20000
- takeScreenshot: 01-page-card
- tapOn: "Open Launch dashboard"
- extendedWaitUntil:
    visible: "Share"
    timeout: 20000
- takeScreenshot: 02-page-screen
- tapOn: "Share"
- extendedWaitUntil:
    visible: "Who can view"
    timeout: 10000
- takeScreenshot: 03-share-sheet
- tapOn: "Anyone with the link"
- extendedWaitUntil:
    visible: "Copy link"
    timeout: 10000
- takeScreenshot: 04-share-link
- tapOn: "Only you"
- openLink: "labradoodle:///pages?threadId=${LABRADOODLE_SCREENSHOT_THREAD_ID}"
- extendedWaitUntil:
    visible: "Launch dashboard"
    timeout: 20000
- takeScreenshot: 05-pages-list
- longPressOn: "Launch dashboard"
- extendedWaitUntil:
    visible: "Pin"
    timeout: 10000
- takeScreenshot: 06-pages-menu
