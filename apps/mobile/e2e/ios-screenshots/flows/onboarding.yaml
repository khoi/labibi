appId: com.labradoodle.app
name: Onboarding
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      LABRADOODLE_ACTIVE_EMAIL: ${LABRADOODLE_SCREENSHOT_EMPTY_EMAIL}
- extendedWaitUntil:
    visible: "New chat"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-empty-inbox
- openLink: "labradoodle:///artifacts"
- extendedWaitUntil:
    visible: "No artifacts yet|Files"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-empty-artifacts
