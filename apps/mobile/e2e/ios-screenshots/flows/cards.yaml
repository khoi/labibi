appId: com.labradoodle.app
name: Request cards
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      LABRADOODLE_ACTIVE_EMAIL: ${LABRADOODLE_SCREENSHOT_EMAIL}
- openLink: "labradoodle:///thread?threadId=${LABRADOODLE_SCREENSHOT_CARDS_THREAD_ID}"
- extendedWaitUntil:
    visible: ".*api.example.test.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-api-key
- scrollUntilVisible:
    element: ".*Which tone should replies use.*"
    direction: UP
    timeout: 15000
    visibilityPercentage: 100
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-choice-and-computer
- scrollUntilVisible:
    element: ".*Sign in to the help desk.*"
    direction: UP
    timeout: 15000
    visibilityPercentage: 100
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-answered-requests
- scrollUntilVisible:
    element: ".*Gmail.*"
    direction: UP
    timeout: 15000
    visibilityPercentage: 100
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-app-connect
