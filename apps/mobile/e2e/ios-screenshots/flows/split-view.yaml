appId: com.labradoodle.app
name: Split view
---
# On a phone this is a single column; on an unfolded iPhone Duo the chat list sits beside it.
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      LABRADOODLE_ACTIVE_EMAIL: ${LABRADOODLE_SCREENSHOT_EMAIL}
- openLink: "labradoodle:///thread?threadId=${LABRADOODLE_SCREENSHOT_THREAD_ID}"
- extendedWaitUntil:
    visible: ".*The fixture workspace is ready.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-chat-beside-list
- runFlow:
    when:
      visible: "Hide chats"
    commands:
      - tapOn: "Hide chats"
      - extendedWaitUntil:
          visible: "Show chats"
          timeout: 5000
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: 02-chats-hidden
      - tapOn: "Show chats"
