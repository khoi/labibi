appId: com.labradoodle.app
name: Skills
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      LABRADOODLE_ACTIVE_EMAIL: ${LABRADOODLE_SCREENSHOT_EMAIL}
- openLink: "labradoodle:///skills"
- extendedWaitUntil:
    visible: ".*Review Kit.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-skills
- tapOn: "Labradoodle"
- extendedWaitUntil:
    visible: ".*name: Labradoodle.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-skill
- tapOn: "Back"
- tapOn: ".*New skill.*"
- extendedWaitUntil:
    visible: "Save"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-new-skill
- openLink: "labradoodle:///skills"
- tapOn: ".*Review Kit.*"
- extendedWaitUntil:
    visible: ".*Install.*|.*Add.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-plugin
