appId: com.labradoodle.app
name: Thread error recovery
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      LABRADOODLE_ACTIVE_EMAIL: ${LABRADOODLE_SCREENSHOT_EMAIL}
- openLink: "labradoodle:///thread?botId=${LABRADOODLE_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*weekly limit.*"
    timeout: 20000
- assertVisible: "Add model"
- assertNotVisible: "Change model"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-limit-banner
- tapOn: "Details"
- extendedWaitUntil:
    visible: ".*reply stopped at its key's weekly limit.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-limit-details
