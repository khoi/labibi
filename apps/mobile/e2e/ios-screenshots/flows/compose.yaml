appId: com.labradoodle.app
name: Compose
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      LABRADOODLE_ACTIVE_EMAIL: ${LABRADOODLE_SCREENSHOT_EMAIL}
- openLink: "labradoodle:///new-chat"
- extendedWaitUntil:
    visible: ".*Dana Teammate.*"
    timeout: 15000
- tapOn: "Dana Teammate"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-new-chat
- openLink: "labradoodle:///"
