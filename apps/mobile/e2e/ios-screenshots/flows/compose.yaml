appId: com.rakazo.app
name: Compose
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- openLink: "rakazo:///new-group"
- extendedWaitUntil:
    visible: "Search bots"
    timeout: 15000
- tapOn: "Researcher"
- tapOn: "Writer"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-new-group
- tapOn: "Next"
- assertVisible: "Skip"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-new-group-name
- openLink: "rakazo:///"
