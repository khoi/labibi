appId: com.rakazo.app
name: Compose
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- openLink: "rakazo:///new-chat"
- extendedWaitUntil:
    visible: ".*Dana Teammate.*"
    timeout: 15000
- tapOn: "Dana Teammate"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-new-chat
- openLink: "rakazo:///"
