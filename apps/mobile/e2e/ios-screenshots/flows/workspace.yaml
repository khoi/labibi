appId: com.rakazo.app
name: Workspace
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- openLink: "rakazo:///approvals"
- extendedWaitUntil:
    visible: ".*example.com.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-approval-rules
- openLink: "rakazo:///vault"
- extendedWaitUntil:
    visible: ".*deploy_token.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-vault
- tapOn: "Help desk"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-vault-item
- tapOn: "Remove"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-vault-remove
- tapOn: "Cancel"
- tapOn: "Done"
- tapOn: "New item"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-vault-new
- tapOn: "Card"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-vault-new-card
- tapOn: "Cancel"
- openLink: "rakazo:///space-members?spaceId=${RAKAZO_SCREENSHOT_TEAM_SPACE_ID}"
- extendedWaitUntil:
    visible: "Owner"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 09-space-members
